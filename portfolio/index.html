digital:{n:"Digital Skills",c:"#2563eb",d:"Cybersécurité, prompt engineering et podcast avec NotebookLM.",s:[
["Se protéger sur Internet","d",[["Triangle CIA","Confidentialité, intégrité, disponibilité : toute attaque vise au moins l’une des trois."],["Virus","S’attache à un fichier hôte et ne se propage pas seul (Melissa, 1999)."],["Ver","Programme autonome qui se copie à travers le réseau (ILOVEYOU, Conficker)."],["Cheval de Troie","Se présente comme un logiciel utile mais ouvre une porte dérobée ou vole des données."],["Ransomware","Chiffre les fichiers puis exige une rançon (WannaCry, 2017, qui se propageait comme un ver)."],["Gravité","En moyenne : ransomware, ver, trojan, virus, adware. Cela dépend toujours de ce qu’on a à perdre."]]],
["Phishing, mots de passe, sauvegarde","l",["Indices d’un e-mail frauduleux : domaine douteux (paypa1), urgence ou menace, salutation générique, lien dont l’adresse réelle diffère, pièce jointe inattendue (.zip, .docm), fautes.","Survoler un lien sans cliquer : le vrai domaine est juste avant le premier « / ».","Un bon mot de passe est long, unique et imprévisible : phrase de passe de 4 à 6 mots au hasard, 12 caractères minimum, un gestionnaire pour les retenir.","Double authentification : clé physique FIDO2 (très élevé), application TOTP (bon), SMS (moyen).","Règle 3-2-1 : 3 copies, 2 supports différents, 1 copie hors site. C’est la meilleure parade au ransomware.","Si j’ai cliqué : fermer la page, déconnecter la machine, changer les mots de passe depuis un appareil sain, lancer l’antivirus, prévenir le service informatique."]],
["Prompt engineering","d",[["C.R.A.D.E.F.V.","Contexte, Rôle, Action, Données, Exigences, Format, Vérification. Pas besoin de tout mettre à chaque fois."],["Itérer","Version 1, critique, version 2, contrôle des faits, format final."],["Vérifier","Une IA peut se tromper : tester la commande, comparer au cours, citer les sources."]]],

["Échanger deux variables","c","tampon ← a\na ← b\nb ← tampon"],
["Analyser avant de coder","l",["Comprendre : lire l’énoncé, trouver l’objectif réel, reformuler.","Identifier : entrées, sortie, contraintes (types, bornes, règles métier) et cas limites.","Structurer : découper en étapes, puis valider à la main sur plusieurs cas, y compris les cas limites.","Année bissextile : divisible par 4 et non par 100, ou divisible par 400."]],
["Chaînes de caractères","d",[["Indices","De 0 à Longueur(ch)-1. On parcourt avec une boucle Pour."],["Fonctions","Longueur, Concat, Copier(Ch, Pos, L), Position(Ch1, Ch2) qui rend 0 si absent, Couper."],["Palindrome","Comparer ch[i] avec ch[n-1-i] : une seule différence suffit pour conclure que ce n’est pas un palindrome."]]],

c:{n:"Langage C",c:"#b45309",d:"Structure d’un programme, types, conditions, boucles, tableaux, chaînes, fonctions.",s:[
["Les bases","d",[["Programme","#include, #define, fonctions, puis main. Chaque instruction se termine par « ; »."],["Types","int, float, double, char. Pas de type booléen : 0 vaut faux, tout le reste vaut vrai."],["Opérateurs","5 / 2 donne 2 avec deux entiers, 5.0 / 2 donne 2.5. % ne marche que sur des entiers. == compare, = affecte."],["Entrées-sorties","printf avec %d %f %c %s. scanf utilise &variable, sauf pour une chaîne."]]],
["Structures de contrôle","l",["if / else et switch (chaque case se termine par break).","for quand le nombre de tours est connu ; while teste avant ; do … while s’exécute au moins une fois.","break sort de la boucle, continue passe à l’itération suivante."]],
["Tableaux et chaînes","l",["Un tableau de N éléments a pour indices 0 à N-1 ; sa taille doit être une constante.","Une chaîne est un tableau de char terminé par le caractère nul « \\0 » : un tableau de N cases contient au plus N-1 lettres.","string.h : strlen, strcpy, strcat, strcmp. On ne peut pas écrire nom = \"abc\" après la déclaration.","Tri par sélection : chercher le plus petit, le placer en première position, recommencer à partir de la suivante."]],
["Fonctions : passage par adresse","c","#include <stdio.h>\nvoid echange(int *x, int *y){\n  int tampon = *x;\n  *x = *y;\n  *y = tampon;\n}\nint main(){\n  int a = 8, b = 3;\n  echange(&a, &b);   /* a = 3, b = 8 */\n  return 0;\n}"],
["Structures","l",["struct regroupe des champs de types différents ; typedef évite de répéter le mot struct.","Accès avec le point (e.age) ou, depuis un pointeur, avec la flèche (p->age).","Par valeur, la fonction travaille sur une copie ; par adresse, elle modifie la variable de l’appelant."]]]},

["Chemins et jokers","d",[["Chemins","Absolu : commence par /. ~ est le répertoire personnel, . le répertoire courant, .. le parent."],["*","Zéro ou plusieurs caractères : ls *.txt"],["?","Exactement un caractère : doc?.txt prend doc1.txt mais pas doc10.txt."],["[ ]","Un caractère parmi une liste ou une plage : doc[1-3].txt, doc[13].txt."]]],
["Redirections et tubes","d",[[">","Écrase le fichier avec la sortie standard."],[">>","Ajoute à la fin du fichier."],["2>","Redirige les messages d’erreur."],["<","La commande lit son entrée dans un fichier."],["|","Envoie la sortie d’une commande vers l’entrée de la suivante : who | wc -l"]]],

["Liens, permissions, vi","d",[["ln / ln -s","Lien physique : même inode, les données survivent à la suppression de l’original. Lien symbolique : son propre inode, il devient cassé si la cible disparaît."],["chmod","r = 4, w = 2, x = 1. chmod 750 donne rwx pour le propriétaire, r-x pour le groupe, rien pour les autres."],["vi","i pour insérer, Esc pour revenir au mode commande, dd supprime une ligne, yy copie, p colle, /mot cherche."],["Sortir de vi",":wq sauvegarde et quitte, :q! quitte sans sauvegarder, :%s/ancien/nouveau/g remplace partout."]]],

["Composants et mémoires","d",[["Carte mère","Relie les composants par des bus : socket (processeur), chipset, BIOS en mémoire morte, horloge temps réel, slots de RAM."],["Von Neumann / Harvard","Mémoire commune pour programme et données, ou deux mémoires séparées."],["SRAM / DRAM","SRAM : 6 transistors, rapide, sans rafraîchissement (caches). DRAM : 1 transistor + 1 condensateur, dense, rafraîchie toutes les 64 ms."],["HDD / SSD","Disque mécanique à plateaux, ou mémoire Flash sans pièce mobile, plus rapide et plus silencieuse."]]],
["Bases et compléments","l",["n bits représentent 2ⁿ valeurs : de 0 à 2ⁿ − 1 sans signe.","Décimal vers base b : divisions successives, restes lus de bas en haut. 156 = 1001 1100₂ = 234₈ = 9C₁₆.","Binaire vers octal : groupes de 3 bits ; vers hexadécimal : groupes de 4 bits, depuis la droite.","Complément à 2 : inverser tous les bits puis ajouter 1 (−N = 2ⁿ − N). Sur 8 bits, la plage va de −128 à +127.","Soustraction : A − B = A + (complément à 2 de B), retenue sortante ignorée."]],
["Portes logiques","d",[["NON, ET, OU","Négation, produit, somme logique. NAND et NOR sont universelles."],["XOR","Vaut 1 quand les deux entrées diffèrent."],["Demi-additionneur","S = A ⊕ B et C = A · B."],["Additionneur complet","S = A ⊕ B ⊕ Cin et Cout = A · B + Cin · (A ⊕ B)."]]],
["Codage des caractères","l",["ASCII sur 7 bits : « A » = 65, « a » = 97, « 0 » = 48 (écart de 32 entre majuscule et minuscule).","UTF-8 : 1 à 4 octets, compatible ASCII. « é » (U+00E9) devient C3 A9.","IEEE 754 simple précision : 1 bit de signe, 8 bits d’exposant (biais 127), 23 bits de mantisse."]]]},

["Définitions","d",[["Système embarqué","Système autonome qui intègre logiciel et matériel conçus ensemble pour une fonction précise."],["Système mobile","Portatif et utilisable de façon autonome en déplacement."],["Collectif / personnel","Collectif (train, centrale) : vie longue, sûreté forte, coût élevé. Personnel (téléphone) : mise sur le marché rapide, coût accessible."]]],
["Caractéristiques","l",["Autonomie : de fonctionnement, fonctionnelle, énergétique.","Spécificité, réactivité, robustesse et fiabilité, faible consommation, flexibilité (reprogrammation, FPGA, composants IP).","Volume et poids réduits, coût bas, cycle de renouvellement court (time to market)."]],
["Temps réel","d",[["Idée clé","Temps réel ne veut pas dire rapide : il faut respecter l’échéance de façon prévisible. Le pire cas compte, pas la moyenne."],["Dur","Une échéance manquée fait échouer le système (frein ABS, trafic aérien)."],["Souple","Le retard est gênant mais sans gravité (affichage de données)."],["Ferme","Le résultat tardif n’a plus de valeur et est écarté (image vidéo)."]]],
["Chaînes fonctionnelles","d",[["Information","Acquérir, Traiter, Communiquer."],["Énergie","Alimenter, Distribuer, Convertir, Transmettre et adapter, Agir."],["Linéarité","Si e1 donne s1 et e2 donne s2, alors a·e1 + b·e2 donne a·s1 + b·s2. s = a·e + b avec b ≠ 0 n’est pas linéaire."]]],
["Processeurs d’un SEM","d",[["µP","CISC (instructions riches, plusieurs cycles) ou RISC (instructions simples, souvent 1 cycle, moins de consommation)."],["DSP","Optimisé pour le signal : multiplication-addition (MAC) en 1 cycle, architecture Harvard."],["µC","Processeur, mémoires et entrées-sorties sur une seule puce."],["ASIC, FPGA, SoC","Circuit sur mesure ; circuit reconfigurable ; système complet sur puce."]]]]}

 P={items:kind=="m"?mono(i):dial(i),i:0,on:true,r:1,k:0};
 st.innerHTML=`<section class=stage><div class=sh><span>${kind=="m"?"Lecture":"Épisode"} · ${M[i].n}</span><span id=pt></span></div><div class=bar><i id=pb></i></div><div class=ctl><button onclick="jump(-1)" aria-label="Ligne précédente">⏮</button><button id=pp class=go onclick="tog()" aria-label="Lecture ou pause">⏸</button><button onclick="jump(1)" aria-label="Ligne suivante">⏭</button><label>Vitesse <select onchange="P.r=+this.value;if(P.on)say()"><option value=.8>0,8×</option><option value=1 selected>1×</option><option value=1.25>1,25×</option><option value=1.5>1,5×</option></select></label></div><div class=tr id=tr>${P.items.map((x,j)=>`<p class="ln${x.h?" hd":""}" onclick="P.on=true;P.i=${j};say()">${x.n?`<b>${x.n}</b>`:""}${esc(x.t)}</p>`).join("")}</div><p class=note>La voix vient de ton appareil. Si elle parle anglais, installe une voix française dans les réglages. Clique sur une ligne pour y sauter.</p></section>`;
 st.scrollIntoView({block:"start",behavior:"smooth"});say()}
function say(){if(!S)return;S.cancel();const it=P.items[P.i];if(!it){P.on=false;P.i=P.items.length-1;return ui()}const k=++P.k,u=new SpeechSynthesisUtterance(it.t),v=S.getVoices().filter(x=>/^fr/i.test(x.lang)),el=it.n=="Élève";u.lang="fr-FR";u.rate=P.r;u.pitch=el?1.3:1;if(v.length)u.voice=v[el&&v.length>1?1:0];u.onend=()=>{if(P.on&&k==P.k){P.i++;say()}};setTimeout(()=>{if(k==P.k)S.speak(u)},60);ui()}
function tog(){P.on=!P.on;if(P.on)say();else{S.cancel();P.k++;ui()}}
function jump(d){P.i=Math.min(Math.max(P.i+d,0),P.items.length-1);if(P.on)say();else ui()}
function stopP(){if(S)S.cancel();P.on=false;P.k++}
function ui(){const t=document.getElementById("tr");if(!t)return;[...t.children].forEach((e,j)=>e.classList.toggle("on",j==P.i));const e=t.children[P.i];if(e)t.scrollTo({top:e.offsetTop-36,behavior:"smooth"});document.getElementById("pb").style.width=(P.i+1)/P.items.length*100+"%";document.getElementById("pp").textContent=P.on?"⏸":"▶";document.getElementById("pt").textContent=(P.i+1)+" / "+P.items.length}
const SRC=(k,i)=>`audio/${k=="l"?"lecture":"podcast"}-${i}.mp3`;
const AU=new Audio();AU.preload="metadata";let CUR=null;
const fmt=s=>!isFinite(s)?"–:–":Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
function durs(){document.querySelectorAll("[data-dur]").forEach(e=>{const a=new Audio();a.preload="metadata";a.onloadedmetadata=()=>{e.textContent=fmt(a.duration)};a.src=e.dataset.dur})}
function play(k,i){stopP();const st=document.getElementById("stage");if(!st)return;CUR={k,i};const ids2=ids,n=ids2.indexOf(i);
 st.innerHTML=`<section class=stage aria-label="Lecteur audio"><div class=sh><div><span class=eq aria-hidden=true><i></i><i></i><i></i><i></i></span><span>${M[i].n}</span><p class=sub>${k=="l"?"Lecture du cours":"Podcast · épisode "+(n+1)}</p></div><span id=at>0:00 / –:–</span></div><input type=range id=sk class=sk min=0 max=1000 value=0 aria-label="Position" oninput="if(isFinite(AU.duration))AU.currentTime=this.value/1000*AU.duration"><div class=ctl><button onclick="nx(-1)" aria-label="Précédent">⏮</button><button class=sm onclick="AU.currentTime=Math.max(0,AU.currentTime-15)" aria-label="Reculer de 15 secondes">−15</button><button id=ap class=go onclick="atog()" aria-label="Lecture ou pause">⏸</button><button class=sm onclick="AU.currentTime=Math.min(AU.duration||0,AU.currentTime+15)" aria-label="Avancer de 15 secondes">+15</button><button onclick="nx(1)" aria-label="Suivant">⏭</button><label>Vitesse <select onchange="AU.playbackRate=+this.value"><option value=.8>0,8×</option><option value=1 selected>1×</option><option value=1.25>1,25×</option><option value=1.5>1,5×</option><option value=2>2×</option></select></label><a class=dl href="${SRC(k,i)}" download>Télécharger</a></div></section>`;
 AU.src=SRC(k,i);AU.playbackRate=1;AU.play().catch(()=>{});mark();st.scrollIntoView({block:"nearest",behavior:"smooth"})}
function atog(){if(AU.paused)AU.play().catch(()=>{});else AU.pause()}
function nx(d){if(!CUR)return;const n=(ids.indexOf(CUR.i)+d+ids.length)%ids.length;play(CUR.k,ids[n])}
function mark(){document.querySelectorAll("[data-tk]").forEach(e=>e.classList.toggle("on",!!CUR&&e.dataset.tk==CUR.k+CUR.i))}
function aui(){const t=document.getElementById("at"),s=document.getElementById("sk"),p=document.getElementById("ap");if(t)t.textContent=fmt(AU.currentTime)+" / "+fmt(AU.duration);if(s&&isFinite(AU.duration)&&document.activeElement!==s)s.value=AU.currentTime/AU.duration*1000;if(p)p.textContent=AU.paused?"▶":"⏸";const sg=document.querySelector(".stage");if(sg)sg.classList.toggle("playing",!AU.paused&&!AU.ended)}
["timeupdate","play","pause","loadedmetadata"].forEach(ev=>AU.addEventListener(ev,aui));
AU.addEventListener("ended",()=>{if(CUR&&ids.indexOf(CUR.i)<ids.length-1&&location.hash=="#ecoute")nx(1)});
const listen=()=>`<h1>Lectures audio</h1><p class=lead>La lecture de chaque cours, enregistrée en entier. Pratique dans le bus ou avant de dormir. Les lectures s’enchaînent toutes seules.</p><div id=stage></div><div class=tks>${ids.map(i=>`<button class=tk data-tk="l${i}" style="--c:${M[i].c}" onclick="play('l','${i}')"><span class=gl>${G[i]}</span><div><h3>${M[i].n}</h3><p>${M[i].d}</p></div><span class=du data-dur="${SRC("l",i)}">–:–</span><span class=pl aria-hidden=true>▶</span></button>`).join("")}</div>`;
const pod=()=>`<h1>Podcasts</h1><p class=lead>Un épisode par matière : l’essentiel du cours, les pièges de l’examen et des conseils pour réviser, sur un ton détendu.</p><div id=stage></div><div class=grid>${ids.map((i,n)=>`<button class="card ep" data-tk="p${i}" style="--c:${M[i].c}" onclick="play('p','${i}')"><span class=gl>${G[i]}</span><h3>${M[i].n}</h3><p>Épisode ${n+1} · <span data-dur="${SRC("p",i)}">–:–</span></p></button>`).join("")}</div>`+`<h2>Mon podcast NotebookLM</h2><p class=lead>Génère l’Audio Overview dans NotebookLM, télécharge le fichier audio, puis charge-le ici pour l’écouter. Il n’est pas enregistré sur le site.</p><input type=file accept="audio/*" onchange="loadA(this)"><audio id=au controls hidden></audio>`;
function loadA(f){AU.pause();const a=document.getElementById("au");if(f.files[0]){a.src=URL.createObjectURL(f.files[0]);a.hidden=false;a.play().catch(()=>{})}}
function typing(){clearInterval(tv);const e=document.getElementById("ty");if(!e)return;const L=["ls -la ~/TP_Linux","−5 = 1111 1011₂  (complément à 2)","while [ \"$i\" -le \"$N\" ]; do","A − B = A + (¬B + 1)","echange(&a, &b);","Acquérir → Traiter → Communiquer"];let n=0,c=0,d=1;if(matchMedia("(prefers-reduced-motion:reduce)").matches){e.textContent=L[0];return}tv=setInterval(()=>{if(!e.isConnected){clearInterval(tv);return}c+=d;e.textContent=L[n].slice(0,c);if(c>=L[n].length+14)d=-1;if(c<=0){d=1;n=(n+1)%L.length}},70)}
const R=document.documentElement,th=document.getElementById("th");
function sth(t){R.dataset.theme=t;th.querySelector(".tl").textContent=t=="dark"?"Sombre":"Clair";th.setAttribute("aria-pressed",t=="dark");th.setAttribute("aria-label",t=="dark"?"Passer en mode clair":"Passer en mode sombre");try{localStorage.setItem("th",t)}catch(e){}}
let t0;try{t0=localStorage.getItem("th")}catch(e){}
sth(t0||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
th.onclick=()=>sth(R.dataset.theme=="dark"?"light":"dark");
go();
