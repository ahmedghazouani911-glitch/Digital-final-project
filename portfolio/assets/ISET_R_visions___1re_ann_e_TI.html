.pick{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}

.chip span{display:grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:999px;background:var(--sf);font:700 .85rem "JetBrains Mono",monospace;color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.stage{background:#06291f;color:#ecfdf5;border:1px solid #1f6b50;border-radius:22px;padding:18px;margin:22px 0}

<script>
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const M={
digital:{n:"Digital Skills",c:"#047857",d:"Cybersécurité, prompt engineering et podcast avec NotebookLM.",s:[
["Se protéger sur Internet","d",[["Triangle CIA","Confidentialité, intégrité, disponibilité : toute attaque vise au moins l’une des trois."],["Virus","S’attache à un fichier hôte et ne se propage pas seul (Melissa, 1999)."],["Ver","Programme autonome qui se copie à travers le réseau (ILOVEYOU, Conficker)."],["Cheval de Troie","Se présente comme un logiciel utile mais ouvre une porte dérobée ou vole des données."],["Ransomware","Chiffre les fichiers puis exige une rançon (WannaCry, 2017, qui se propageait comme un ver)."],["Gravité","En moyenne : ransomware, ver, trojan, virus, adware. Cela dépend toujours de ce qu’on a à perdre."]]],
["Phishing, mots de passe, sauvegarde","l",["Indices d’un e-mail frauduleux : domaine douteux (paypa1), urgence ou menace, salutation générique, lien dont l’adresse réelle diffère, pièce jointe inattendue (.zip, .docm), fautes.","Survoler un lien sans cliquer : le vrai domaine est juste avant le premier « / ».","Un bon mot de passe est long, unique et imprévisible : phrase de passe de 4 à 6 mots au hasard, 12 caractères minimum, un gestionnaire pour les retenir.","Double authentification : clé physique FIDO2 (très élevé), application TOTP (bon), SMS (moyen).","Règle 3-2-1 : 3 copies, 2 supports différents, 1 copie hors site. C’est la meilleure parade au ransomware.","Si j’ai cliqué : fermer la page, déconnecter la machine, changer les mots de passe depuis un appareil sain, lancer l’antivirus, prévenir le service informatique."]],
["Prompt engineering","d",[["C.R.A.D.E.F.V.","Contexte, Rôle, Action, Données, Exigences, Format, Vérification. Pas besoin de tout mettre à chaque fois."],["Itérer","Version 1, critique, version 2, contrôle des faits, format final."],["Vérifier","Une IA peut se tromper : tester la commande, comparer au cours, citer les sources."]]],
["Exemple de prompt amélioré","c","Je suis étudiant en L1 informatique. Explique chmod 755 et chmod 644\nen français simple, moins de 250 mots, sous forme de tableau puis\ndeux exemples de commandes. Signale ce qui doit être vérifié."],
["Podcast avec NotebookLM","l",["Créer un notebook, puis ajouter le PDF du cours comme source.","Poser des questions pour comprendre : synthèse, 10 questions de révision, notion difficile.","Générer l’Audio Overview en français, écouter, puis comparer avec le PDF.","Garder les prompts et noter une amélioration possible."]]]},
algo:{n:"Algorithmique",c:"#0e7490",d:"Variables, affectation, analyse d’un problème, chaînes de caractères.",s:[
["Les bases","d",[["Variable","Espace mémoire nommé dont la valeur peut changer. Une constante garde toujours la même valeur."],["Types","entier, réel, caractère, chaîne, booléen."],["Affectation ←","Se lit de droite à gauche : on calcule l’expression, puis on range le résultat dans la variable."],["Lire / Ecrire","Lire(x) demande une valeur ; ECRIRE(…) affiche un texte ou un résultat."]]],
["Échanger deux variables","c","tampon ← a\na ← b\nb ← tampon"],
["Analyser avant de coder","l",["Comprendre : lire l’énoncé, trouver l’objectif réel, reformuler.","Identifier : entrées, sortie, contraintes (types, bornes, règles métier) et cas limites.","Structurer : découper en étapes, puis valider à la main sur plusieurs cas, y compris les cas limites.","Année bissextile : divisible par 4 et non par 100, ou divisible par 400."]],
["Chaînes de caractères","d",[["Indices","De 0 à Longueur(ch)-1. On parcourt avec une boucle Pour."],["Fonctions","Longueur, Concat, Copier(Ch, Pos, L), Position(Ch1, Ch2) qui rend 0 si absent, Couper."],["Palindrome","Comparer ch[i] avec ch[n-1-i] : une seule différence suffit pour conclure que ce n’est pas un palindrome."]]],
["Compter les voyelles","c","nbVoyelles ← 0\nPour i de 0 à Longueur(mot)-1 Faire\n  SI mot[i] = 'A' OU mot[i] = 'E' OU mot[i] = 'I'\n     OU mot[i] = 'O' OU mot[i] = 'U' ALORS\n    nbVoyelles ← nbVoyelles + 1\n  FIN SI\nFinPour"]]},
c:{n:"Langage C",c:"#b45309",d:"Structure d’un programme, types, conditions, boucles, tableaux, chaînes, fonctions.",s:[
["Les bases","d",[["Programme","#include, #define, fonctions, puis main. Chaque instruction se termine par « ; »."],["Types","int, float, double, char. Pas de type booléen : 0 vaut faux, tout le reste vaut vrai."],["Opérateurs","5 / 2 donne 2 avec deux entiers, 5.0 / 2 donne 2.5. % ne marche que sur des entiers. == compare, = affecte."],["Entrées-sorties","printf avec %d %f %c %s. scanf utilise &variable, sauf pour une chaîne."]]],
["Structures de contrôle","l",["if / else et switch (chaque case se termine par break).","for quand le nombre de tours est connu ; while teste avant ; do … while s’exécute au moins une fois.","break sort de la boucle, continue passe à l’itération suivante."]],
["Tableaux et chaînes","l",["Un tableau de N éléments a pour indices 0 à N-1 ; sa taille doit être une constante.","Une chaîne est un tableau de char terminé par le caractère nul « \\0 » : un tableau de N cases contient au plus N-1 lettres.","string.h : strlen, strcpy, strcat, strcmp. On ne peut pas écrire nom = \"abc\" après la déclaration.","Tri par sélection : chercher le plus petit, le placer en première position, recommencer à partir de la suivante."]],
["Fonctions : passage par adresse","c","#include <stdio.h>\nvoid echange(int *x, int *y){\n  int tampon = *x;\n  *x = *y;\n  *y = tampon;\n}\nint main(){\n  int a = 8, b = 3;\n  echange(&a, &b);   /* a = 3, b = 8 */\n  return 0;\n}"],
["Structures","l",["struct regroupe des champs de types différents ; typedef évite de répéter le mot struct.","Accès avec le point (e.age) ou, depuis un pointeur, avec la flèche (p->age).","Par valeur, la fonction travaille sur une copie ; par adresse, elle modifie la variable de l’appelant."]]]},
systeme:{n:"Atelier système",c:"#4f46e5",d:"Linux, redirections, filtres, éditeur vi, scripts Bash et comparaison CMD / PowerShell.",s:[
["Commandes essentielles","d",[["pwd, cd, ls","Répertoire courant, changer de dossier, lister (ls -l détails, ls -a fichiers cachés)."],["mkdir -p","Crée un dossier et ses parents manquants."],["touch, cp, mv, rm","Créer un fichier vide, copier, déplacer ou renommer, supprimer (sans corbeille)."],["cat, more, less","Afficher un fichier, entièrement ou page par page."],["man, --help","Documentation d’une commande."]]],
["Chemins et jokers","d",[["Chemins","Absolu : commence par /. ~ est le répertoire personnel, . le répertoire courant, .. le parent."],["*","Zéro ou plusieurs caractères : ls *.txt"],["?","Exactement un caractère : doc?.txt prend doc1.txt mais pas doc10.txt."],["[ ]","Un caractère parmi une liste ou une plage : doc[1-3].txt, doc[13].txt."]]],
["Redirections et tubes","d",[[">","Écrase le fichier avec la sortie standard."],[">>","Ajoute à la fin du fichier."],["2>","Redirige les messages d’erreur."],["<","La commande lit son entrée dans un fichier."],["|","Envoie la sortie d’une commande vers l’entrée de la suivante : who | wc -l"]]],
["Filtres et recherche","c","find /usr/include -name \"std*.h\"\ngrep -v \"Mohamed\" agenda.txt\ncut -d: -f7 /etc/passwd | sort | uniq | wc -l\nhead -n 7 /etc/passwd | tail -n 1\nsort -r etudiants.txt | head -n 2"],
["Liens, permissions, vi","d",[["ln / ln -s","Lien physique : même inode, les données survivent à la suppression de l’original. Lien symbolique : son propre inode, il devient cassé si la cible disparaît."],["chmod","r = 4, w = 2, x = 1. chmod 750 donne rwx pour le propriétaire, r-x pour le groupe, rien pour les autres."],["vi","i pour insérer, Esc pour revenir au mode commande, dd supprime une ligne, yy copie, p colle, /mot cherche."],["Sortir de vi",":wq sauvegarde et quitte, :q! quitte sans sauvegarder, :%s/ancien/nouveau/g remplace partout."]]],
["Script Bash : somme des pairs jusqu’à N","c","#!/bin/bash\nread N\nsomme=0\ni=2\nwhile [ \"$i\" -le \"$N\" ]; do\n  somme=$((somme + i))\n  i=$((i + 2))\ndone\necho \"$somme\""],
["CMD et PowerShell","d",[["CMD","Les commandes produisent du texte : tasklist | findstr chrome."],["PowerShell","Les commandes produisent des objets : Get-Process | Where-Object {$_.CPU -gt 100}."],["Équivalents","dir = Get-ChildItem, cd = Set-Location, copy = Copy-Item, taskkill = Stop-Process."]]]]},
archi:{n:"Architecture et numération",c:"#be123c",d:"Histoire, composants, bases 2/8/10/16, compléments, mémoires, portes logiques, Unicode.",s:[
["Histoire","d",[["1642","Pascaline (Blaise Pascal) : addition et soustraction."],["1840","Machine analytique (Babbage) : cartes perforées, mémoire et unité de calcul."],["1946","ENIAC : premier ordinateur électronique, 17 468 tubes."],["1951","Machine de l’IAS (Von Neumann) : programme enregistré en mémoire comme les données."],["1948 / 1971","Transistor, puis microprocesseur Intel 4004 (bus de 4 bits, 2 300 transistors)."]]],
["Composants et mémoires","d",[["Carte mère","Relie les composants par des bus : socket (processeur), chipset, BIOS en mémoire morte, horloge temps réel, slots de RAM."],["Von Neumann / Harvard","Mémoire commune pour programme et données, ou deux mémoires séparées."],["SRAM / DRAM","SRAM : 6 transistors, rapide, sans rafraîchissement (caches). DRAM : 1 transistor + 1 condensateur, dense, rafraîchie toutes les 64 ms."],["HDD / SSD","Disque mécanique à plateaux, ou mémoire Flash sans pièce mobile, plus rapide et plus silencieuse."]]],
["Bases et compléments","l",["n bits représentent 2ⁿ valeurs : de 0 à 2ⁿ − 1 sans signe.","Décimal vers base b : divisions successives, restes lus de bas en haut. 156 = 1001 1100₂ = 234₈ = 9C₁₆.","Binaire vers octal : groupes de 3 bits ; vers hexadécimal : groupes de 4 bits, depuis la droite.","Complément à 2 : inverser tous les bits puis ajouter 1 (−N = 2ⁿ − N). Sur 8 bits, la plage va de −128 à +127.","Soustraction : A − B = A + (complément à 2 de B), retenue sortante ignorée."]],
